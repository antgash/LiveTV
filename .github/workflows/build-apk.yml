name: Build Live TV APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-30" >/dev/null
      - name: Build
        run: BUILD_TOOLS=34.0.0 VERSION_CODE=$((1 + ${{ github.run_number }})) ./build.sh
      - uses: actions/upload-artifact@v4
        with: { name: LiveTV, path: build/LiveTV.apk }
