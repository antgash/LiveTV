name: Build Live TV APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-30" >/dev/null
      - name: Build
        run: BUILD_TOOLS=34.0.0 VERSION_CODE=$((1 + ${{ github.run_number }})) VERSION_NAME=1.0.${{ github.run_number }} bash build.sh
      - uses: actions/upload-artifact@v4
        with: { name: LiveTV, path: build/LiveTV.apk }
      - name: Publish a numbered release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="v1.0.${{ github.run_number }}"
          NOTES="Built automatically from commit ${GITHUB_SHA::7}. versionCode: $((1 + ${{ github.run_number }}))"
          # a re-run of the same build replaces its release instead of failing on the existing tag
          gh release delete "$TAG" -y --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" build/LiveTV.apk --target "$GITHUB_SHA" -t "Live TV $TAG" -n "$NOTES" --latest
          # Keep the newest 10 releases; older ones (and their tags) are removed so the page stays tidy.
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r t; do
            gh release delete "$t" -y --cleanup-tag || true
          done
